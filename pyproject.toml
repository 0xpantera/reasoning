[project]
name = "reasoning"
version = "0.1.0"
description = "A reasoning model implementation following Reasoning from Scratch"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "0xpantera", email = "0xpantera@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "tokenizers>=0.21.2",
    "torch>=2.10,<3",
]

[project.urls]
Repository = "https://github.com/0xpantera/reasoning"
Reference = "https://github.com/rasbt/reasoning-from-scratch"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.4.4",
]
